
info:
  name: creer compt utilisateur
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/auth/register
  body:
    type: json
    data: |
      {
        "nom": "{{nom}}",
        "login": "{{login}}",
        "password": "{{password}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

