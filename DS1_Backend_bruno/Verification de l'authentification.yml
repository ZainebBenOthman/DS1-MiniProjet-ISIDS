info:
  name: Verification de l'authentification
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/auth/me
  auth:
    type: bearer
    token: "{{jwt_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
