info:
  name: Afficher un projet par id
  type: http
  seq: 7

http:
  method: GET
    url: http://localhost:3000/projects/{{project_id}}
    auth:
      type: bearer
      token: "{{jwt_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
